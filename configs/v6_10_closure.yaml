reference_plan_audit:
  scope: all_50_formal_pool_tasks_before_any_gpu_generation
  receipt_protocol: v6_reference_execution_preflight_v1
  authoritative_artifact: reference_preflight_receipt.json
  sanitized_plans_embedded_in_receipt: true
  optional_derived_jsonl_must_hash_back_to_receipt: true
  raw_reference_replay:
    execute_every_registered_reference_slot: true
    retain_raw_results_for_audit: true
    environment_reward_scope: TAU2_EVALUATION_TYPE_ENV_STRICT_REPLAY
    environment_reward_required: 1.0
    repeat_environment_reward_required: 1.0
    full_official_reward_status: DEFERRED_TO_DYNAMIC_JUDGE
  expected_reference_error_classification:
    exact_tool_error_observed: true
    agent_db_hash_unchanged: true
    user_db_hash_unchanged_when_available: true
    user_db_unavailable_requires_explicit_null_before_and_after: true
    unexpected_errors_forbidden: true
  sanitized_successful_reference_plan:
    remove_only_expected_state_preserving_failed_calls: true
    preserve_original_relative_order_of_retained_slots: true
    freeze_retained_reference_indices: true
    replay_from_same_prefix: true
    environment_reward_required: 1.0
    full_official_reward_status: DEFERRED_TO_DYNAMIC_JUDGE
    final_agent_db_hash_equal_to_raw_reference_replay: true
    final_user_db_evidence_equal_including_explicit_absence: true
    zero_tool_errors: true
    unsuccessful_sanitization_action: reject_task_and_continue
  candidate_action_eligibility:
    reference_slot_must_be_retained_in_sanitized_plan: true
    reference_call_must_execute_successfully: true
    repeated_semantically_identical_calls_use_exact_registered_index: true
    at_least_two_distinct_successful_full_reference_calls_per_task: true
    three_registered_candidate_pairs_per_qualifying_task: true

positive_data_construction:
  source: sanitized_oracle_reference_plan
  shared_prefix: single_user_turn_before_first_assistant_tool_action
  clean_view:
    execute_sanitized_reference_plan: true
    completion_renderer: explicit_user_direct_v3
    official_task_success_required: 1.0
    zero_tool_errors: true
    all_nonfailed_assistant_outputs_supervised: true
  recovery_view:
    inject_one_real_state_preserving_identifier_error: true
    failed_call_and_error_result_are_prompt_context_only: true
    failed_call_supervised: false
    error_result_supervised: false
    force_registered_successful_corrective_action_first: true
    complete_with_remaining_sanitized_reference_plan: true
    additional_tool_errors_allowed: false
    official_task_success_required: 1.0
    final_state_equal_to_sanitized_clean_view: true
    independent_replay_required: true
  provenance_fields:
    - raw_reference_plan_sha256
    - raw_reference_results_sha256
    - expected_error_slots
    - sanitized_reference_indices
    - sanitized_reference_plan_sha256
    - sanitized_replay_sha256
  oracle_constructed_positive_data_must_not_be_called_fresh_teacher_data: true

unforced_teacher_first_action:
  prompt: exact_shared_prefix_plus_executed_injected_error
  gold_reference_actions_visible_to_teacher: false
  evaluation_criteria_visible_to_teacher: false
  query_count_per_error_context: 1
  retry_on_semantically_valid_wrong_action: false
  malformed_or_missing_tool_call_counts_as_incorrect: true
  first_unretried_assistant_tool_call_only: true
  seed_source: registered_branch_recovery_seed
  metric: matched_registered_corrective_full_call_accuracy
  error_blind_balanced_pair_accuracy: 0.50

forced_first_causal_measurement:
  name: kappa
  cells:
    - q_e1_a1
    - q_e1_a2
    - q_e2_a1
    - q_e2_a2
  formula: "0.5 * ((R_ii + R_jj) - (R_ij + R_ji))"
  reward: official_end_to_end_task_success
  forced_content: first_recovery_tool_action_only
  continuation_policy: frozen_fresh_72b_teacher_agent
  continuation_policy_common_across_four_cells: true
  continuation_model_revision_common: true
  continuation_seed_set_common: true
  decoding_and_rollout_budget_common: true
  gold_reference_actions_visible_to_continuation: false
  evaluation_criteria_visible_to_continuation: false
  deterministic_reference_completion_in_cells: forbidden
  matched_action_may_not_be_added_later_by_oracle_replay: true
  retries_per_seed: 0
  compatibility_continuation_seeds: [20260806]
  scientific_continuation_seeds: [20260806, 20260807, 20260808]
  max_steps: 60
  max_tokens: 512
  cell_record_must_include:
    - forced_call
    - forced_tool_result
    - complete_continuation_messages
    - continuation_seed
    - official_reward_info
    - independent_replay
    - gold_access_audit

compatibility_gate:
  role: engineering_authorization_only
  official_test_used: false
  static_reference_audit:
    all_50_tasks_terminal: true
    every_task_has_raw_reference_audit: true
    every_qualifying_task_has_sanitized_plan_or_typed_rejection: true
  dynamic_compatibility:
    exact_tasks_terminal: 24
    minimum_tasks_each_with_three_accepted_pairs: 22
    minimum_total_accepted_pairs: 66
    mandatory_regression_tasks_with_pass_or_exact_typed_ineligibility: 7
    expected_pairs_per_passing_task: 3
    zero_future_leakage: true
    zero_failed_positive_labels: true
    zero_additional_failed_calls_in_positive_suffix: true
    clean_and_recovery_independent_replay_required: true
    causal_cells_use_gold_free_path: true
    unforced_teacher_probe_recorded: true
  kappa_distribution_thresholds_applied: false
  authorizes: immutable_v6_10_scientific_static_release_and_prospective_pilot

prospective_pilot_gate:
  all_26_tasks_must_reach_terminal_pass_or_rejected_receipt: true
  minimum_tasks_each_with_three_accepted_pairs: 16
  minimum_total_accepted_pairs: 48
  minimum_domains: 2
  minimum_error_families: 3
  zero_future_leakage: true
  zero_failed_positive_labels: true
  zero_additional_failed_calls_in_positive_suffix: true
  matched_and_independent_replay_required: true
  kappa_high:
    threshold: 0.75
    minimum_fraction: 0.20
  kappa_low:
    threshold: 0.25
    comparison: less_than_or_equal
    minimum_fraction: 0.20
  maximum_single_kappa_bucket_fraction: 0.80
  unforced_teacher_action_switch_accuracy_minimum: 0.80
  teacher_minus_error_blind_minimum: 0.20
  code_config_model_or_threshold_change_after_start: forbidden
  failure_action: preserve_no_go_and_stop_before_formal_generation

formal_pool_gate:
  all_50_tasks_must_reach_terminal_pass_or_rejected_receipt: true
  minimum_tasks_each_with_three_accepted_pairs: 48
  minimum_pairs_from_qualifying_tasks: 144
  minimum_domains: 2
  minimum_error_families: 3
  prospective_identifiability_gate_reapplied: true
  tasks_48_or_more: formal_selection_authorized
  tasks_40_to_47: screen_only_no_formal_claim
  tasks_below_40: stop
  freeze_atomic_candidate_pool_before_measurement: true
  regenerate_per_selector: forbidden

task_failure_semantics:
  task_reject_and_continue:
    - raw_reference_or_sanitized_plan_not_successful
    - sanitized_plan_final_state_mismatch
    - fewer_than_two_successful_distinct_corrective_calls
    - injected_error_not_real_or_not_state_preserving
    - matched_positive_recovery_failed
    - independent_replay_failed_for_one_task
    - unsupported_task_local_assertion
  global_abort:
    - official_test_accessed
    - source_or_container_contract_drift
    - tau2_split_registry_or_config_drift
    - model_server_identity_drift
    - future_leakage_detected
    - shard_overlap_or_missing_registered_task
    - artifact_hash_corruption
    - unclassified_exception
  infrastructure_retry:
    incomplete_task_receipt_reusable: false
    retry_same_seed_and_contract_only: true
    maximum_task_process_restarts: 2
    exhaustion_action: global_abort
  accepted_pool_written_only_after_all_expected_tasks_are_terminal: true
  rejected_tasks_never_enter_candidate_pool: true

provenance_contract:
  source:
    git_commit_required: true
    clean_worktree_required: true
    untracked_files_forbidden_in_source_and_tau2: true
    git_tree_or_release_bundle_sha256_required: true
    relevant_script_sha256_required: true
    config_sha256_required: true
    preregistration_sha256_required: true
  environment:
    declared_pinned_container_image_digest_cross_bound_required: true
    container_digest_not_claimed_as_live_observation: true
    dependency_requirements_spec_sha256_required: true
    dependency_artifact_is_not_a_full_transitive_lock: true
    python_torch_cuda_driver_vllm_versions_required: true
    gpu_model_uuid_and_memory_required: true
    exact_gpu_model: NVIDIA RTX PRO 4500 Blackwell
    exact_gpu_count: 3
    minimum_memory_mib_per_gpu: 32000
  benchmark:
    tau2_commit_and_clean_worktree_required: true
    split_manifest_sha256_required: true
    task_file_sha256_required: true
  model_servers:
    one_receipt_per_endpoint_required: true
    runtime_service_session:
      id_format: "v6_10-runtime-a{two_digit_attempt}-{utc_timestamp}"
      one_process_set_per_session_directory: true
      service_restart_requires_new_session_id: true
      service_restart_requires_new_runtime_receipts: true
      service_restart_requires_new_release_manifest: true
      immutable_reference_preflight_reusable_across_sessions: true
      immutable_registry_reusable_across_sessions: true
      runtime_session_id_is_operational_namespace_not_identity_evidence: true
      identity_evidence_is_pid_snapshot_socket_and_receipt_hashes: true
    served_model_id_revision_snapshot_and_quantization_required: true
    dtype: float16
    max_model_len: 8192
    gpu_memory_utilization: 0.90
    launch_command_and_container_digest_required: true
    safe_local_snapshot_argv_required: true
    load_format: safetensors
    live_server_pid_start_and_socket_ownership_required: true
    live_cuda_visibility_must_match_gpu_uuids: true
    snapshot_identity_files_and_weight_blob_ids_required: true
    verify_process_and_snapshot_before_and_after_probe: true
    generator_must_revalidate_live_process_before_generation: true
    healthcheck_and_tokenizer_or_config_hash_required: true
    api_base_is_transport_metadata_not_model_identity: true
  run:
    attempt_id_required: true
    utc_start_and_end_required: true
    exact_argv_required: true
    semantic_contract_sha256_required: true
    shard_contract_required: true
    parent_artifact_hashes_required: true
    official_test_seal_state_required: true
  receipts_must_bind_source_container_model_and_semantic_contract: true

runtime_parallelism:
  num_shards: 1
  shard_index: 0
  cross_shard_merge_supported_in_this_release: false
  reason: single_3x5090_host_and_no_verified_cross_shard_merger
  changing_shard_count_or_index: forbidden

resume_and_fresh_run:
  status_semantics:
    execution_status_pass_means_atomic_task_completed: true
    scientific_outcomes:
    - ACCEPTED
    - REJECTED
    typed_scientific_rejection_is_not_execution_failure: true
  resumable_only_when:
    - same_attempt_id
    - same_runtime_service_session
    - same_source_commit_and_clean_tree
    - same_container_digest
    - same_registry_config_and_semantic_contract
    - same_reference_preflight_and_runtime_receipt_hashes
    - same_release_manifest_hash
    - same_model_server_receipt_hashes
    - same_single_shard_task_mapping
    - same_seeds_decoding_and_budgets
  resumable_receipts: atomic_execution_status_pass_only
  partial_task_output_action: quarantine_and_rerun_same_task
  model_service_restart_requires_new_runtime_session_and_generation_attempt: true
  code_config_model_registry_or_task_map_change_requires_new_attempt_directory: true
  compatibility_receipts_reusable_in_pilot: false
  pilot_receipts_reusable_in_formal: false
  receipts_from_different_source_commits_mergeable: false
  single_shard_closure_requires_exact_terminal_task_partition: true

attempt_naming:
  format: "v6_10-{stage}-a{two_digit_attempt}-{utc_timestamp}"
  allowed_stages:
    - static
    - compat
    - pilot
    - formal
    - measure
    - select
    - train
    - eval
  attempt_number_is_not_design_version: true
  task_specific_runtime_failure_must_not_create_v6_11: true

selection_and_training:
  selection_unit: candidate_pair
  one_pair_contains_two_sibling_error_branches: true
  primary_matched_task_pairs_per_selector: 1
  selectors:
    primary_baseline: random_stratified
    primary_method: full_proposed
    random_stratified_seeds: [20260806, 20260807, 20260808]
    full_proposed_weights: {causal: 0.50, hardness: 0.25, coverage: 0.25}
  exact_supervised_target_token_budget_common_across_recovery_selectors: true
  maximum_cross_arm_token_spread_fraction: 0.005
  directional_screen:
    arms: [flawless_only, random_stratified, full_proposed]
    student: Qwen/Qwen2.5-7B-Instruct
    training_seeds: [20260722]
    evaluation_seeds: [20260722, 20260723, 20260724]
  formal:
    student_scale: 14B
    minimum_training_seeds: 3
    minimum_evaluation_seeds: 3

evaluation_and_statistics:
  primary_contrast: full_proposed_minus_random_stratified
  primary_estimand: paired_task_mean_controlled_error_success_delta
  independent_unit: task_id
  evaluation_seeds_are_repeated_measurements_not_independent_tasks: true
  task_cluster_bootstrap_replicates: 10000
  clean_noninferiority_margin: -0.05
  primary_claim_requires:
    - official_end_to_end_task_success
    - paired_task_level_delta
    - task_cluster_confidence_interval
    - clean_noninferiority_analysis
  official_unseal_receipt_required: true
  no_metric_or_checkpoint_rule_changes_after_unseal: true

