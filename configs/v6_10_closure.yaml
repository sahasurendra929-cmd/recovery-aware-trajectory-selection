experiment_name: v6_10_causal_recovery_pipeline_closure
protocol: v6_10_pipeline_closure_v1
design_version: "6.10"
status: preregistered_before_any_v6_10_runtime_outcome

runtime_readiness:
  compatibility_ready_only_after_all_closure_gates_pass: true
  prospective_pilot_ready: false
  official_evaluation_ready: false
  blockers_before_prospective_pilot:
    - v6_end_to_end_evaluator_implemented_tested_hashed_and_frozen
    - v6_task_cluster_statistical_summarizer_implemented_tested_hashed_and_frozen

lineage:
  supersedes_runtime_protocol: v6_9_complementizer_normalization_v1
  v6_through_v6_9_role: engineering_and_protocol_development_only
  pool_prior_runtime_results: false
  prior_24_task_pilot_reclassified_as: compatibility_development_suite
  new_scientific_version_after_runtime_failure: forbidden
  runtime_attempts_are_not_versions: true

research_question: >-
  Under a fixed supervised-token and training-compute budget, does selecting
  successful recovery training pairs using a frozen combination of
  policy-conditional forced-first causal sensitivity, frozen-base hardness,
  and coverage improve controlled-error end-to-end task success relative to
  matched stratified-random selection?

claim_boundary:
  primary_contribution: recovery_trajectory_data_selection
  positive_training_data_source: sanitized_oracle_reference_construction
  positive_data_is_teacher_generated: false
  causal_measurement_source: gold_free_fresh_teacher_continuation
  causal_score_interpretation: policy_conditional_forced_first_sensitivity
  causal_score_is_not_policy_invariant_necessity: true
  first_action_measurement: unforced_single_teacher_query
  primary_training_objective: SFT
  primary_metric: controlled_error_end_to_end_official_task_success
  next_tool_call_metrics_are_diagnostic_only: true
  pipeline_completion_is_not_a_scientific_result: true
  positive_result_guaranteed: false

