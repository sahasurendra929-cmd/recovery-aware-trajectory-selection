experiment_name: v6_6_causal_recovery_single_turn_clean_prefix
protocol: v6_6_single_turn_user_reference_replay_v1
design_version: "6.6"
supersedes:
  protocol: v6_5_forced_correction_reference_completion_v1
  predecessor_result: PILOT_NO_GO
  failure_task: "retail:104"
  reason: >-
    Both frozen V6.5 clean attempts consumed the full interaction budget and
    received official reward zero after the user simulator repeatedly supplied
    invented mnemonic order IDs. Seven prior task receipts passed, but no
    atomic merged pool was emitted.
  results_must_not_be_merged: true

frozen_delta:
  only_scientific_change: single_turn_user_prefix_before_reference_clean_replay
  clean_prefix:
    source: unchanged_tau2_user_simulator_first_response
    retained_history:
      - initial_assistant_greeting
      - first_user_response
    stop_before_first_assistant_tool_action: true
    user_simulator_receives_evaluation_criteria: false
    user_simulator_receives_official_test: false
    clean_future: deterministic_tau2_reference_action_execution
    clean_future_official_reward_must_equal: 1.0
    clean_future_deleted_before_recovery: true
  task_ids_changed: false
  registry_or_error_branches_changed: false
  gates_changed: false
  selectors_or_weights_changed: false
  models_or_revisions_changed: false
  seeds_or_decoding_changed: false
  deterministic_recovery_completion_changed: false
  training_or_evaluation_changed: false

models:
  trajectory_teacher:
    model: Qwen/Qwen2.5-72B-Instruct-AWQ
    revision: 698703eae6604af048a3d2f509995dc302088217
  user_simulator_and_strict_judge:
    model: Qwen/Qwen2.5-14B-Instruct-AWQ
    revision: 539535859b135b0244c91f3e59816150c8056698
  directional_screen_student:
    model: Qwen/Qwen2.5-7B-Instruct
    revision: a09a35458c702b33eeacc393d103063234e8bc28

benchmark:
  name: tau2
  commit: fc0055dc4e0a316c3f83133267fbd6faaa770992
  partition_sha256: c90255a2cf4100d8cf5b5fcf3e684144ed1a393fad1c214058146721c4ed6818
  arm_train:
    tasks: 70
  official_test:
    sealed: true
    used_during_generation_scoring_selection_or_model_selection: false
    ids_or_content_exported_to_generation_workers: false
  pilot_tasks: 24
  pilot_candidate_pairs: 72
  formal_tasks: 50
  formal_candidate_pairs: 150

recovery:
  mode: deterministic_reference_completion
  forced_action_first: true
  remaining_reference_actions_once_in_original_relative_order: true
  continuation_seeds: [20260806, 20260807, 20260808]

selection:
  full_proposed_weights:
    causal: 0.50
    hardness: 0.25
    coverage: 0.25
  primary_contrast: full_proposed_minus_random_stratified
  primary_metric: controlled_error_end_to_end_official_task_success
  clean_noninferiority_margin: -0.05
  task_cluster_bootstrap_replicates: 10000

official_test:
  sealed: true
  used: false
  unseal_rule: >-
    once only after protocol, pool, scores, manifests, training, checkpoints,
    and model-selection decision are frozen and hashed

smoke:
  task: "retail:104"
  expected_candidate_pairs: 3
  expected_branches: 6
  require_all_replays: true
  require_zero_future_leakage: true
  require_official_test_unused: true
