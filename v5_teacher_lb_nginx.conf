pid /workspace/v5-nginx/nginx.pid;
error_log /workspace/v5-nginx/error.log info;

events {
    worker_connections 1024;
}

http {
    access_log /workspace/v5-nginx/access.log;
    upstream v5_teacher_pool {
        least_conn;
        server 127.0.0.1:8111;
        server 127.0.0.1:8112;
        server 127.0.0.1:8113;
        keepalive 32;
    }
    server {
        listen 127.0.0.1:8101;
        client_max_body_size 32m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        location / {
            proxy_pass http://v5_teacher_pool;
        }
    }
}
